# Builds the Keep Atlas (docs/atlas/build.py) from master and publishes it to GitHub Pages.
name: Atlas

on:
  push:
    branches: [master]
    paths: ["src/**", "res/**", "docs/atlas/**", "*.py", "*.sh", ".github/workflows/atlas.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python docs/atlas/build.py --out _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
