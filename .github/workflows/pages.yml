# Builds the GitHub Pages site from master: the Keep Atlas (docs/atlas/build.py) under atlas/, and at the root a
# redirect to the repository, where the readme page that used to stand there now points.
name: Pages

on:
  push:
    branches: [master]
    paths: ["src/**", "res/**", "docs/atlas/**", "*.py", "*.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python docs/atlas/build.py --out _site/atlas/index.html
      - run: |
          cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>Keep</title>
          <meta name="color-scheme" content="light dark">
          <meta http-equiv="refresh" content="0; url=https://github.com/maciekd/Keep">
          <link rel="canonical" href="https://github.com/maciekd/Keep">
          <script>location.replace("https://github.com/maciekd/Keep")</script>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
