# Builds the public GitHub Pages site from master: the readme (docs/site/build.py) at the root — the repository is
# private, the page is not — and the Keep Atlas (docs/atlas/build.py) under atlas/.
name: Pages

on:
  push:
    branches: [master]
    paths: ["src/**", "res/**", "docs/atlas/**", "docs/site/**", "docs/images/**", "readme.md", "*.py", "*.sh",
            ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python docs/site/build.py --out _site
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python docs/atlas/build.py --out _site/atlas/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
