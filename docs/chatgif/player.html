<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>chatgif player</title>
<style>
  :root {
    --bg: #18222d;
    --bar: #1c2733;
    --line: #0f161e;
    --text: #ffffff;
    --dim: #b1c3d5;
    --muted: #6d7f91;
    --accent: #2ea6ff;
    --font: -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
  #app { width: var(--w); height: var(--h); display: flex; flex-direction: column; background: var(--bg); }

  /* header */
  #header { flex: none; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
            background: var(--bar); border-bottom: 1px solid var(--line); }
  #header img { width: 42px; height: 42px; border-radius: 50%; }
  #header .name { font-size: 17px; font-weight: 600; }
  #header .status { font-size: 14px; color: var(--muted); margin-top: 2px; }
  #header .status.typing { color: var(--accent); }

  /* chat */
  #chat { flex: 1; overflow: hidden; padding: 12px 16px 8px; }
  .msg { display: flex; gap: 20px; margin-top: 22px; }
  .msg:first-child { margin-top: 6px; }
  .msg.cont { margin-top: 12px; }                 /* a follow-up from the same sender: no avatar, tighter */
  .msg.cont .avatar { visibility: hidden; }
  .msg.cont .head { display: none; }
  .avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; margin-top: -2px; }
  .body { flex: 1; min-width: 0; }
  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .who { font-size: 19px; font-weight: 600; }
  .meta { font-size: 16px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .meta svg { width: 22px; height: 22px; }
  .photo { position: relative; width: 100%; border-radius: 10px; overflow: hidden; margin: 2px 0 10px; background: #000; }
  .photo .blur { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(30px) brightness(.4) saturate(.8); }
  .photo img { position: relative; display: block; margin: 0 auto; height: 100%; }
  .text { font-size: 18px; line-height: 1.32; white-space: pre-wrap; word-wrap: break-word; }
  .text code { font-family: "SF Mono", Menlo, monospace; font-size: 16px; background: #0f161e; padding: 1px 5px; border-radius: 4px; }
  .cmd .text { font-style: italic; }
  .cmd .text a { color: var(--accent); text-decoration: none; }

  /* compose bar */
  #compose { flex: none; background: var(--bar); border-top: 1px solid var(--line); }
  #attach { display: none; align-items: center; gap: 12px; padding: 12px 20px 0; }
  #attach.on { display: flex; }
  #attach img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; }
  #attach .file { font-size: 15px; color: var(--text); }
  #attach .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
  #bar { display: flex; align-items: center; gap: 14px; height: 62px; padding: 0 18px; }
  #bar svg { width: 26px; height: 26px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  /* a real input keeps the caret in view: rtl on the box clips overflow on the left, the span itself stays ltr */
  #input { flex: 1; font-size: 18px; color: var(--text); white-space: nowrap; overflow: hidden; direction: rtl; text-align: left; }
  #input span.t { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  #input.empty { color: var(--muted); }
  #caret { display: inline-block; width: 2px; height: 22px; background: var(--text); vertical-align: -4px; margin-left: 1px; }
  #send { display: none; }
  #send svg { stroke: var(--accent); fill: var(--accent); }
  #bar.ready #mic { display: none; }
  #bar.ready #send { display: block; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <img id="h-avatar" alt="">
    <div><div class="name" id="h-name"></div><div class="status" id="h-status"></div></div>
  </div>
  <div id="chat"></div>
  <div id="compose">
    <div id="attach"><img id="attach-img" alt=""><div><div class="file" id="attach-file"></div><div class="sub">Photo</div></div></div>
    <div id="bar">
      <svg viewBox="0 0 24 24"><path d="M21 12.5l-8.5 8.5a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7l-9 9a2 2 0 0 1-2.8-2.8l8.3-8.3"/></svg>
      <div id="input"></div>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 10h.01M15 10h.01"/></svg>
      <svg id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <div id="send"><svg viewBox="0 0 24 24"><path d="M3 11.5L21 3l-8.5 18-2.5-7.5z"/></svg></div>
    </div>
  </div>
</div>
<script>
const S = /*SCENARIO*/ null;

const D = Object.assign({
  width: 900, height: 1000, lead: 0.8, tail: 5, after: 0.8, transition: 3,
  type_cps: 22, stream_cps: 70, thinking: 1.6, command_pace: 1, send_pause: 0.5, image_height: 640, status: 'bot', snap_scroll: true,
}, S);
document.documentElement.style.setProperty('--w', D.width + 'px');
document.documentElement.style.setProperty('--h', D.height + 'px');

// --- timeline: every message gets absolute times, so a frame is a pure function of t ---------
// A `transition` marker between messages ends a chapter: the finished chat holds for `transition`
// seconds, clears, and the next chapter starts after `lead` on a blank chat like the first one.
// A trailing marker replaces `tail`: the loop restarts right after the hold.
const isMarker = m => m === 'transition' || (m && m.transition !== undefined);
const T = [], clears = [];
let cursor = D.lead, lastAfter = 0, chapter = 0;
for (const m of D.messages) {
  if (isMarker(m)) {
    const at = cursor - lastAfter + (typeof m.transition === 'number' ? m.transition : D.transition);
    clears.push(at);
    cursor = at + D.lead; lastAfter = 0; chapter++;
    continue;
  }
  const len = Math.max(1, (m.text || '').length);
  const e = { m, chapter };
  if (m.from === 'user') {
    e.typeStart = cursor + (m.pause_before || 0);
    e.sendAt = e.typeStart + len / (m.cps || D.type_cps) + D.send_pause;
    e.showAt = e.sendAt;
    cursor = e.sendAt + (m.after ?? D.after);
  } else {
    e.thinkStart = cursor + (m.pause_before || 0);
    // the "• doing X" command echoes the assistant posts while it works, one every command_pace s
    const pace = m.command_pace ?? D.command_pace;
    e.cmds = (m.commands || []).map((text, i) => ({ text, at: e.thinkStart + i * pace }));
    e.showAt = e.thinkStart + e.cmds.length * pace + (m.thinking ?? D.thinking);
    e.streamEnd = e.showAt + len / (m.cps || D.stream_cps);
    cursor = e.streamEnd + (m.after ?? D.after);
  }
  lastAfter = m.after ?? D.after;
  T.push(e);
}
const DURATION = isMarker(D.messages.at(-1)) ? clears.at(-1) : cursor - lastAfter + D.tail;
window.duration = () => DURATION;

// --- inline markdown (**bold**, *italic*, ~~strike~~, `code`) into runs, sliced by plain chars ---
function runs(text) {
  const out = [];
  const st = { b: false, i: false, k: false, c: false };
  const re = /(\*\*|~~|`|\*)/g;
  let pos = 0, mt;
  const push = s => { if (s) out.push({ s, ...st }); };
  while ((mt = re.exec(text))) {
    push(text.slice(pos, mt.index));
    const k = mt[0];
    if (k === '**') st.b = !st.b; else if (k === '~~') st.k = !st.k; else if (k === '`') st.c = !st.c; else st.i = !st.i;
    pos = mt.index + k.length;
  }
  push(text.slice(pos));
  return out;
}
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function renderRuns(rs, n) {
  let html = '', left = n;
  for (const r of rs) {
    if (left <= 0) break;
    let s = esc(r.s.slice(0, left)); left -= r.s.length;
    if (r.c) s = `<code>${s}</code>`;
    if (r.b) s = `<b>${s}</b>`;
    if (r.i) s = `<i>${s}</i>`;
    if (r.k) s = `<s>${s}</s>`;
    html += s;
  }
  return html;
}
function snapToWord(plain, n) {           // reveal whole words: the LLM stream arrives in tokens, not letters
  if (n >= plain.length) return plain.length;
  const sp = plain.indexOf(' ', n), nl = plain.indexOf('\n', n);
  const next = [sp, nl].filter(i => i >= 0);
  return next.length ? Math.min(...next) : plain.length;
}

// --- rendering ------------------------------------------------------------------------------
const URL_RE = /(?:https?:\/\/)?(?:[\w-]+\.)+[a-z]{2,}(?:\/[^\s)]*)?/gi;
const linkify = s => esc(s).replace(URL_RE, u => `<a>${u}</a>`);
const CHECKS = '<svg viewBox="0 0 24 24" fill="none" stroke="#2ea6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12.5l4.5 4.5L15 8.5M9.5 17l1.5 1.5L21 8.5"/></svg>';
const P = D.participants;
const el = id => document.getElementById(id);
el('h-avatar').src = P.assistant.avatar;
el('h-name').textContent = P.assistant.name;

function message(e, t, cont) {
  const m = e.m, p = P[m.from];
  const rs = runs(m.text || '');
  const plain = rs.map(r => r.s).join('');
  let n = plain.length;
  if (m.from !== 'user') n = snapToWord(plain, Math.floor((t - e.showAt) * (m.cps || D.stream_cps)));
  const photo = m.image ? `<div class="photo" style="height:${m.image_height || D.image_height}px">
      <div class="blur" style="background-image:url('${m.image}')"></div><img src="${m.image}"></div>` : '';
  const meta = (m.from === 'user' ? CHECKS : '') + `<span>${m.time || ''}</span>`;
  return `<div class="msg${cont ? ' cont' : ''}"><img class="avatar" src="${p.avatar}">
    <div class="body"><div class="head"><span class="who" style="color:${p.color}">${esc(p.name)}</span><span class="meta">${meta}</span></div>
    ${photo}<div class="text">${renderRuns(rs, n)}</div></div></div>`;
}
function commandLine(text, cont) {    // a command echo: the assistant's name, no time, "doing X" in italics
  const p = P.assistant;
  return `<div class="msg cmd${cont ? ' cont' : ''}"><img class="avatar" src="${p.avatar}">
    <div class="body"><div class="head"><span class="who" style="color:${p.color}">${esc(p.name)}</span></div>
    <div class="text">${linkify(text)}</div></div></div>`;
}

// With snap_scroll the chat jumps straight to the bottom. Otherwise it glides there: an exponential
// follower with time constant SCROLL_TAU that carries state between frames, so seek() expects t to
// move forward within a loop (render.py and the live player both do); a jump back restarts it pinned
// to the bottom. The glide is expensive in a GIF: every frame it moves, a photo in view is re-encoded.
const SCROLL_TAU = 0.14;
const scroll = { t: Infinity, pos: 0 };
window.seek = function (t) {
  const chat = el('chat'), ch = clears.filter(at => t >= at).length;
  const items = T.filter(e => e.chapter === ch).flatMap(e => [
    ...(e.cmds || []).filter(c => t >= c.at).map(c => ({ from: 'assistant', html: cont => commandLine(c.text, cont) })),
    ...(t >= e.showAt ? [{ from: e.m.from, html: cont => message(e, t, cont) }] : []),
  ]);
  chat.innerHTML = items.map((it, i) => it.html(i > 0 && items[i - 1].from === it.from)).join('');
  const target = Math.max(0, chat.scrollHeight - chat.clientHeight);
  if (D.snap_scroll || t < scroll.t || ch !== scroll.ch) scroll.pos = target;   // a loop restart or a new chapter: no glide
  else scroll.pos += (target - scroll.pos) * (1 - Math.exp(-(t - scroll.t) / SCROLL_TAU));
  if (Math.abs(target - scroll.pos) < 0.5) scroll.pos = target;
  scroll.t = t; scroll.ch = ch;
  chat.scrollTop = Math.round(scroll.pos);

  const typing = T.find(e => e.thinkStart !== undefined && t >= e.thinkStart && t < e.showAt);
  const status = el('h-status');
  status.textContent = typing ? 'typing…' : D.status;
  status.className = 'status' + (typing ? ' typing' : '');

  const composing = T.find(e => e.typeStart !== undefined && t >= e.typeStart && t < e.sendAt);
  const input = el('input'), bar = el('bar'), attach = el('attach');
  const caret = `<span id="caret" style="visibility:${Math.floor(t * 2) % 2 === 0 ? 'visible' : 'hidden'}"></span>`;
  if (composing) {
    const m = composing.m;
    const n = Math.min(m.text.length, Math.floor((t - composing.typeStart) * (m.cps || D.type_cps)));
    input.innerHTML = `<span class="t">${esc(m.text.slice(0, n))}${caret}</span>`;
    input.className = '';
    bar.className = n > 0 || m.image ? 'ready' : '';
    attach.className = m.image ? 'on' : '';
    if (m.image) { el('attach-img').src = m.image; el('attach-file').textContent = m.image.split('/').pop(); }
  } else {
    input.innerHTML = 'Write a message...';
    input.className = 'empty';
    bar.className = '';
    attach.className = '';
  }
};

// preload every image so a screenshot never catches a half-loaded one
const urls = new Set([P.user.avatar, P.assistant.avatar, ...D.messages.map(m => m.image).filter(Boolean)]);
window.ready = Promise.all([...urls].map(u => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = u; })));

// opened in a browser (not driven by render.py): play in real time, looping
if (!window.__driven) window.ready.then(() => {
  const t0 = performance.now();
  (function frame() { window.seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(frame); })();
});
</script>
</body>
</html>
