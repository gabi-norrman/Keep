# A scripted chat for docs/chatgif/render.py. Paths are relative to this file.
#
# Message keys:  from (user|assistant), text, time, image, and the optional timing overrides
#   cps            typing (user) or streaming (assistant) speed in characters per second
#   thinking       assistant only: seconds of "typing…" in the header before the reply streams
#   commands       assistant only: the "• doing X" command echoes posted before the reply, one per
#                  command_pace seconds (the texts are what Commands.describe() produces)
#   pause_before   seconds of stillness before this message starts
#   after          seconds of stillness after it (the last message uses `tail` instead)
#   image_height   px height of the photo frame for this message
# A bare `- transition` item between messages ends a conversation: the chat holds for `transition`
# seconds, clears, and the next one starts on a blank chat (`- transition: 5` overrides the hold).
# Text supports **bold**, *italic*, ~~strike~~ and `code`.
# snap_scroll (default true) jumps the chat to the bottom when it grows; false glides instead, which
# looks softer but makes the GIF several times larger whenever a photo is on screen.

participants:
  user:
    name: Maciek Drejak
    avatar: ../assets/avatar_maciek.png
    color: "#955cdb"
  assistant:
    name: Michelle
    avatar: ../assets/avatar_michelle.png
    color: "#309eba"

width: 540
height: 960
status: bot          # header subtitle while the assistant is idle
image_height: 460    # px height of the photo frame
lead: 0.8            # seconds before the first message starts
tail: 6              # seconds to hold the finished chat before the GIF loops
transition: 3        # seconds to hold a finished chat before the next one begins
command_pace: 1      # seconds each command echo stays the newest line before the next one
type_cps: 30         # user typing speed
stream_cps: 250      # assistant streaming speed
snap_scroll: true    # jump, don't glide, when the chat scrolls (keeps the GIF small)

