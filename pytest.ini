[pytest]
testpaths = tests/unit
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = INFO
addopts =
    -v
    -s
    --capture=no
    --tb=short
    --strict-markers
    --disable-warnings
    -n 8
    --dist worksteal
markers =
    unit: Unit tests that don't require external dependencies
    integration: Integration tests that may require database or external services
    slow: Tests that take a long time to run
    prompt: Prompt validation tests
    repeat: Run test multiple times for statistical significance
